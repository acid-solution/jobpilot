services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - jobpilot_postgres_data:/var/lib/postgresql/data

volumes:
  jobpilot_postgres_data:
